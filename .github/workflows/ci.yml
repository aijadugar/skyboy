# Skyboy CI.
#
# Design notes worth knowing before editing:
#
#   * `all-checks-pass` is the ONE status check that branch protection should
#     require. It runs with `if: always()` and fails if any job it needs
#     failed, was cancelled, or was skipped when it was supposed to run. That
#     means individual jobs can be added, renamed or gated on an event without
#     anyone having to touch repository settings.
#
#   * Every job writes machine-readable results into `ci-results/` and emits
#     GitHub annotations. Annotations come from the job's own stdout, so they
#     appear inline on the PR "Files changed" tab even for fork PRs, which get
#     a read-only token and therefore cannot comment.
#
#   * `.github/workflows/pr-report.yml` turns the uploaded `ci-results`
#     artifact into a single sticky PR comment.
#
#   * All third-party actions are pinned to a full commit SHA. The trailing
#     comment names the release that SHA belonged to at pin time; use
#     Dependabot (`.github/dependabot.yml`) to move them.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Required so the `all-checks-pass` check reports on merge queue entries.
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to attach this run's results to (optional).
        required: false
        type: string

# Least privilege by default. No job here needs to write to the repository:
# the reporting job lives in pr-report.yml, which declares its own permissions.
permissions:
  contents: read

concurrency:
  # Cancel superseded runs for pull requests only. A merge_group run must never
  # be cancelled, because the merge queue is waiting on its verdict.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  # Change detection
  # ---------------------------------------------------------------------------
  # Decides whether the Rust and desktop jobs are needed. It runs on every
  # event, and the aggregator consults it before accepting a `skipped` result
  # for any job that depends on it.
  #
  # Why a gate job rather than a `paths:` filter on each job: a path filter makes
  # a job `skipped`, and GitHub reports "filtered out" and "could not start" as
  # the same value. `all-checks-pass` cannot tell those apart, so it would have
  # to either trust every skip - which would let a genuinely broken desktop job
  # merge - or refuse every skip, which would mean compiling a Rust GUI to merge
  # a typo fix in a README. Splitting the decision into a job that always reports
  # keeps the gate meaningful. See REQUIRED_ON and GATED_BY in
  # .github/scripts/ci-record.mjs.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # "true" or "false". A gated job may only be skipped when this is "false"
      # and this job succeeded; anything else is a failure.
      desktop: ${{ steps.detect.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff needs both commits of a pull request, which a shallow
          # clone does not have.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      # Every event except a pull request runs the desktop jobs. A push to main,
      # a merge-queue entry and a manual run are all "check everything": the
      # saving is only worth taking where a pull request says plainly which files
      # it touched.
      - name: Detect whether desktop or Rust code changed
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p ci-results
          desktop=true

          if [ "$EVENT_NAME" = "pull_request" ]; then
            desktop=false
            # Explicit SHAs rather than `origin/${{ github.base_ref }}`: on a
            # pull request the checkout is a merge commit, and the base ref is
            # not guaranteed to exist as a local ref.
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > ci-results/changed-files.txt
            # Counted rather than `grep -q`: under `pipefail`, grep -q exits at
            # the first match, the writer takes SIGPIPE, and the pipeline fails
            # for the wrong reason.
            matches=$(grep -Ec \
              '^(apps/desktop/|apps/hook/|packages/|Cargo\.|package\.json$|package-lock\.json$|\.github/workflows/|\.github/scripts/)' \
              ci-results/changed-files.txt || true)
            if [ "${matches:-0}" -gt 0 ]; then
              desktop=true
            fi
            echo "::notice title=Changed files::$(wc -l < ci-results/changed-files.txt) file(s) changed, $matches desktop-related"
          fi

          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "::notice title=Desktop jobs::desktop=$desktop"
          node .github/scripts/ci-record.mjs summary --job changes --tool path-filter \
            --status pass --message "desktop=$desktop"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-changes
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Rust  (fmt, clippy, tests)
  # ---------------------------------------------------------------------------
  # One job for all three, on Linux only. Formatting and lints do not differ by
  # platform; compilation does, and that is what the desktop matrix below is for.
  #
  # The toolchain comes from the runner's own rustup rather than a third-party
  # setup action, following the same reasoning as fetching actionlint directly in
  # the lint job: one less thing pinned to a commit and trusted.
  rust:
    name: Rust
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      - name: Install the Rust components
        shell: bash
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Check formatting
        id: fmt
        continue-on-error: true
        shell: bash
        run: cargo fmt --all -- --check > ci-results/cargo-fmt.log 2>&1

      - name: Run clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings > ci-results/clippy.log 2>&1

      - name: Run the Rust tests
        id: tests
        continue-on-error: true
        shell: bash
        run: cargo test --workspace > ci-results/cargo-test.log 2>&1

      - name: Record Rust results
        if: always()
        shell: bash
        env:
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set +e
          status=0
          code=0; [ "$FMT_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job rust --tool cargo-fmt \
            --input ci-results/cargo-fmt.log --exit-code "$code" || status=1
          code=0; [ "$CLIPPY_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job rust --tool clippy \
            --input ci-results/clippy.log --exit-code "$code" || status=1
          code=0; [ "$TESTS_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job rust --tool cargo-test \
            --input ci-results/cargo-test.log --exit-code "$code" || status=1
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-rust
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Desktop  (compiles on both supported platforms, and the interface builds)
  # ---------------------------------------------------------------------------
  # Bundling installers is the release workflow's job. What this proves is the
  # part that breaks per platform: that the Rust crate and the frontend build on
  # Windows and macOS, which Linux cannot tell you.
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      - name: Install the Rust components
        shell: bash
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee ci-results/npm-ci.log

      - name: Compile the Rust workspace
        id: cargo
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: cargo build --workspace > ci-results/cargo-build.log 2>&1

      - name: Run the interface tests
        id: ui
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: npm --workspace @skyboy/desktop run test > ci-results/ui-tests.log 2>&1

      # This also builds skyboy-hook in release mode, because the interface's
      # build script prepares it for the bundler. So a hook that stops compiling
      # in release fails here too.
      - name: Build the interface
        id: bundle
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: npm --workspace @skyboy/desktop run build > ci-results/ui-build.log 2>&1

      - name: Record desktop results
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CARGO_OUTCOME: ${{ steps.cargo.outcome }}
          UI_OUTCOME: ${{ steps.ui.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
        run: |
          set +e
          job="desktop-${RUNNER_OS}"
          status=0
          if [ "$INSTALL_OUTCOME" != "success" ]; then
            node .github/scripts/ci-record.mjs summary --job "$job" --tool npm \
              --status fail --message "npm ci failed; see the run log" || status=1
            exit "$status"
          fi
          code=0; [ "$CARGO_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job "$job" --tool cargo-build \
            --input ci-results/cargo-build.log --exit-code "$code" || status=1
          code=0; [ "$UI_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job "$job" --tool vitest \
            --input ci-results/ui-tests.log --exit-code "$code" || status=1
          code=0; [ "$BUNDLE_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job "$job" --tool vite-build \
            --input ci-results/ui-build.log --exit-code "$code" || status=1
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-desktop-${{ matrix.os }}
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Hook integration  (the real binary, a real endpoint, both platforms)
  # ---------------------------------------------------------------------------
  # The Rust tests prove the payloads parse. They cannot prove the compiled
  # binary starts, reads stdin for one agent and its trailing argument for the
  # other, finds the endpoint file, connects to a named pipe or a Unix socket,
  # and exits 0 on all of it. Those are the promises the hook makes to a coding
  # agent, and they are the things that differ by platform - the Unix socket
  # path in particular can only be exercised on macOS.
  hook-integration:
    name: Hook integration (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      - name: Build the hook
        id: build
        continue-on-error: true
        shell: bash
        run: cargo build --release -p skyboy-hook > ci-results/hook-build.log 2>&1

      - name: Feed every sample payload through the real binary
        id: e2e
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: node scripts/e2e/hook-to-core.mjs --verbose > ci-results/hook-e2e.log 2>&1

      # Informational: a hook runs on the agent's critical path, so the numbers
      # are worth seeing on every platform, but a slow runner is not a reason to
      # fail a pull request.
      - name: Measure the hook's latency
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: node scripts/measure.mjs --iterations 50 > ci-results/hook-latency.log 2>&1

      - name: Record hook integration results
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          set +e
          job="hook-integration-${RUNNER_OS}"
          status=0
          code=0; [ "$BUILD_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job "$job" --tool cargo-build \
            --input ci-results/hook-build.log --exit-code "$code" || status=1
          code=0; [ "$E2E_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job "$job" --tool hook-e2e \
            --input ci-results/hook-e2e.log --exit-code "$code" || status=1
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-hook-${{ matrix.os }}
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The recorder's own tests
  # ---------------------------------------------------------------------------
  # `all-checks-pass` is the only status check branch protection requires, so the
  # thing that decides its verdict is worth testing. These cover the gate rules:
  # a web-only pull request passes with the desktop jobs skipped, and a skip is
  # refused when the gate failed, when it produced no output, or when it said the
  # jobs were needed.
  ci-record-tests:
    name: CI recorder tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      - name: Test the recorder
        id: tests
        continue-on-error: true
        shell: bash
        run: node --test .github/scripts/ci-record.test.mjs > ci-results/ci-record-tests.log 2>&1

      - name: Record the result
        if: always()
        shell: bash
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set +e
          status=0
          if [ "$TESTS_OUTCOME" = "success" ]; then
            node .github/scripts/ci-record.mjs summary --job ci-record-tests --tool node-test \
              --status pass --message "the aggregator's gate rules hold"
          else
            node .github/scripts/ci-record.mjs summary --job ci-record-tests --tool node-test \
              --status fail --message "the recorder's tests failed; see the run log"
            status=1
          fi
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-ci-record-tests
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      # TODO(app-lint): `npm run lint` is `next lint`, which Next.js 16 removed,
      # and apps/web has no ESLint config at all, so it fails on a clean checkout.
      # Once ESLint is added to apps/web (eslint + eslint-config-next + a flat
      # eslint.config.mjs, and `lint` repointed at the `eslint` CLI), add a step
      # here that runs `npm --workspace apps/web run lint` through
      # `ci-record.mjs parse --tool eslint`. Until then this job lints the
      # repository's own YAML rather than pretending app lint ran.
      - name: Note that app lint is not configured yet
        shell: bash
        run: |
          echo "::notice title=App lint is not configured::The lint job covers .github YAML only."
          echo "::notice title=App lint is not configured::'npm run lint' is still 'next lint', removed in Next.js 16, and apps/web has no ESLint config."

      - name: Install the linters
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results "$RUNNER_TEMP/ci-tools"
          # actionlint is fetched and checksum-verified rather than pulled
          # through a third-party action, so the version is pinned here, in the
          # open, next to its digest. The binary goes to the runner's temp
          # directory so the checkout stays clean.
          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/ci-tools" actionlint
          "$RUNNER_TEMP/ci-tools/actionlint" --version
          python3 -m pip install --user --quiet 'yamllint==1.38.0'
          python3 -m yamllint --version

      - name: Run actionlint
        id: actionlint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: '"$RUNNER_TEMP/ci-tools/actionlint" -format ''{{json .}}'' > ci-results/actionlint.log 2>&1'

      - name: Run yamllint
        id: yamllint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python3 -m yamllint -c .github/.yamllint.yml -f parsable .github > ci-results/yamllint.log 2>&1

      - name: Record lint results
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          YAMLLINT_OUTCOME: ${{ steps.yamllint.outcome }}
        run: |
          set +e
          status=0
          if [ "$INSTALL_OUTCOME" != "success" ]; then
            node .github/scripts/ci-record.mjs summary --job lint --tool toolchain-install \
              --status fail --message "could not install the linters; see the run log" || status=1
            exit "$status"
          fi
          code=0; [ "$ACTIONLINT_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job lint --tool actionlint \
            --input ci-results/actionlint.log --exit-code "$code" || status=1
          code=0; [ "$YAMLLINT_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job lint --tool yamllint \
            --input ci-results/yamllint.log --exit-code "$code" || status=1
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-lint
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Typecheck
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          # `pipefail` is set explicitly so a failing `npm ci` still fails the
          # step even though `tee` exits 0. Do not rely on the runner's default
          # shell flags for this.
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee ci-results/npm-ci.log

      # `--pretty false` gives one line per diagnostic, which is what the
      # recorder parses into file/line/column/rule records.
      - name: Typecheck
        id: check
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: npx --no-install tsc --noEmit --pretty false -p apps/web/tsconfig.json > ci-results/typecheck.log 2>&1

      - name: Record typecheck results
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          set +e
          status=0
          if [ "$INSTALL_OUTCOME" != "success" ]; then
            node .github/scripts/ci-record.mjs summary --job typecheck --tool npm \
              --status fail --message "npm ci failed; see the run log" || status=1
            exit "$status"
          fi
          code=0; [ "$CHECK_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job typecheck --tool tsc \
            --input ci-results/typecheck.log --exit-code "$code" || status=1
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-typecheck
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Format
  # ---------------------------------------------------------------------------
  # Prettier is the only style gate. It runs on every event, pushes to main
  # included, so `main` cannot drift out of format between pull requests.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          # Explicit, so a failing `npm ci` fails the step through `tee`.
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee ci-results/npm-ci.log

      - name: Check formatting
        id: check
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          # Plain output makes the `[warn]` lines countable below.
          NO_COLOR: "1"
        run: npm run format:check > ci-results/format.log 2>&1

      - name: Record format results
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          set +e
          status=0
          if [ "$INSTALL_OUTCOME" != "success" ]; then
            node .github/scripts/ci-record.mjs summary --job format --tool npm \
              --status fail --message "npm ci failed; see the run log" || status=1
            exit "$status"
          fi
          if [ "$CHECK_OUTCOME" = "success" ]; then
            node .github/scripts/ci-record.mjs summary --job format --tool prettier \
              --status pass --message "all files are formatted"
          else
            # Prettier prints one `[warn] <path>` line per unformatted file, then a
            # summary line that also starts with `[warn]`. Count only the paths.
            count=$(grep '^\[warn\] ' ci-results/format.log 2>/dev/null |
              grep -vc 'Code style issues found') || count=0
            node .github/scripts/ci-record.mjs summary --job format --tool prettier \
              --status fail --message "${count} files are not formatted; run npm run format"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-format
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Test  (matrix)
  # ---------------------------------------------------------------------------
  # There is no test suite yet: apps/web's `test` script is a placeholder, so
  # the step below reports that as a notice instead of pretending to test. What
  # the matrix genuinely proves today is that the app compiles and builds on
  # all three supported platforms, which is the part that breaks per-OS. When a
  # real suite lands, it runs here without any change to this file.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # `shell: bash` on every step, on all three runners, so one script body
      # behaves identically everywhere. GitHub's Windows images ship Git Bash.
      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee ci-results/npm-ci.log

      - name: Run the test suite
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          script=$(node -e "const p=require('./apps/web/package.json');process.stdout.write((p.scripts&&p.scripts.test)||'')")
          if [ -z "$script" ] || printf '%s' "$script" | grep -q 'no tests yet'; then
            echo "::notice title=No test suite yet::apps/web has no test suite (scripts.test is '${script}')."
            echo "::notice title=No test suite yet::The matrix still verifies the build on ${RUNNER_OS}."
            exit 0
          fi
          npm --workspace apps/web test > ci-results/tests.log 2>&1

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: npm run build > ci-results/build.log 2>&1

      - name: Record test and build results
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set +e
          status=0
          if [ "$INSTALL_OUTCOME" != "success" ]; then
            node .github/scripts/ci-record.mjs summary --job "test-${RUNNER_OS}" --tool npm \
              --status fail --message "npm ci failed; see the run log" || status=1
            exit "$status"
          fi
          # Anything the suite printed goes through the generic parser, so a
          # failure still lands in the comment even before a real reporter exists.
          code=0; [ "$TESTS_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job "test-${RUNNER_OS}" --tool tests \
            --input ci-results/tests.log --exit-code "$code" || status=1
          code=0; [ "$BUILD_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job "test-${RUNNER_OS}" --tool next-build \
            --input ci-results/build.log --exit-code "$code" || status=1
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-test-${{ matrix.os }}
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Secret scan
  # ---------------------------------------------------------------------------
  # gitleaks-action has no merge_group support, so it is skipped there. The
  # commits it would have scanned are the same ones scanned on the pull request.
  secret-scan:
    name: Secret scan
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      # No GITLEAKS_LICENSE secret is needed: gitleaks-action is free for
      # personal accounts and only requires a licence key for organisations.
      # `aijadugar/skyboy` is a user account. If this repo ever moves under an
      # organisation, add the licence as a secret and pass it here.
      #
      # GITLEAKS_ENABLE_COMMENTS is off on purpose. Its default is on, and a
      # pull request from a fork gets a read-only token, so the action's own
      # comment attempt would fail the job and block an innocent pull request.
      # Its comment would also duplicate the one pr-report.yml posts.
      #
      # GITLEAKS_ENABLE_SUMMARY is off to match how pr-report.yml treats this
      # check: pass or fail with no finding detail. A detected secret should not
      # be echoed into a job summary that is retained for the life of the run;
      # the run log and the maintainer's own investigation are the right places.
      - name: Run gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: false

      - name: Record secret scan results
        if: always()
        shell: bash
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          # Deliberately reports only pass/fail with no per-finding detail:
          # a leak's location is not something to echo back into a comment.
          if [ "$GITLEAKS_OUTCOME" = "success" ]; then
            node .github/scripts/ci-record.mjs summary --job secret-scan --tool gitleaks \
              --status pass --message "no secrets detected"
          else
            node .github/scripts/ci-record.mjs summary --job secret-scan --tool gitleaks \
              --status fail --message "gitleaks reported a possible secret or could not run; see the run log"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-secret-scan
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Dependency review
  # ---------------------------------------------------------------------------
  # Pull requests only: it diffs the dependency manifests of the base and head
  # commits, so there is nothing to review on a push or a merge group entry.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      # `comment-summary-in-pr: never` because a fork pull request only gets a
      # read-only token, and the action fails the step if it cannot comment.
      # Its verdict is reported through the ci-results artifact instead.
      - name: Review dependency changes
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never

      - name: Record dependency review results
        if: always()
        shell: bash
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          if [ "$REVIEW_OUTCOME" = "success" ]; then
            node .github/scripts/ci-record.mjs summary --job dependency-review --tool dependency-review \
              --status pass --message "no vulnerable dependency changes"
          else
            node .github/scripts/ci-record.mjs summary --job dependency-review --tool dependency-review \
              --status fail --message "a dependency change was flagged, or the review could not run; see the run log"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-dependency-review
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Pull request title
  # ---------------------------------------------------------------------------
  # Lives here rather than in its own workflow so that `all-checks-pass`
  # covers it. The title is passed through an environment variable and matched
  # as data; it is never interpolated into a script body. actionlint enforces
  # that rule for this whole file.
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      # No `continue-on-error` here on purpose: `check-title` is the last real
      # step, and a failing step is what makes this job's result `failure`.
      # With `continue-on-error` the job would report `success` and the
      # aggregator would wave a non-conventional title through.
      - name: Check the pull request title
        id: title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node .github/scripts/ci-record.mjs check-title

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-pr-title
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Aggregator - the single required status check
  # ---------------------------------------------------------------------------
  # The job name below must not change: branch protection and the merge queue
  # key off `all-checks-pass`.
  all-checks-pass:
    name: all-checks-pass
    if: always()
    needs:
      - changes
      - lint
      - typecheck
      - format
      - test
      - rust
      - desktop
      - hook-integration
      - ci-record-tests
      - secret-scan
      - dependency-review
      - pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      # Merges every `ci-results-*` artifact into one directory. Allowed to
      # fail: if no job got far enough to upload, the verdict below fails the
      # run, which is the correct outcome.
      - name: Collect per-job results
        id: collect
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-results-*
          path: ci-results
          merge-multiple: true

      - name: Verdict
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          JOB_RESULTS: |
            changes=${{ needs.changes.result }}
            lint=${{ needs.lint.result }}
            typecheck=${{ needs.typecheck.result }}
            format=${{ needs.format.result }}
            test=${{ needs.test.result }}
            rust=${{ needs.rust.result }}
            desktop=${{ needs.desktop.result }}
            hook-integration=${{ needs.hook-integration.result }}
            ci-record-tests=${{ needs.ci-record-tests.result }}
            secret-scan=${{ needs.secret-scan.result }}
            dependency-review=${{ needs.dependency-review.result }}
            pr-title=${{ needs.pr-title.result }}
          # A job's *output* is not available through `needs.<job>.result`, so
          # the gate's decision is passed separately. Without it, a skipped
          # desktop job would be indistinguishable from one that never started.
          GATE_OUTPUTS: |
            desktop=${{ needs.changes.outputs.desktop }}
        run: node .github/scripts/ci-record.mjs verdict

      - name: Upload combined results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # This is the artifact pr-report.yml reads. Its name is part of the
          # contract between the two workflows.
          name: ci-results
          path: ci-results/
          retention-days: 5
          if-no-files-found: error
