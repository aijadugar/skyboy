# Skyboy CI.
#
# Design notes worth knowing before editing:
#
#   * `all-checks-pass` is the ONE status check that branch protection should
#     require. It runs with `if: always()` and fails if any job it needs
#     failed, was cancelled, or was skipped when it was supposed to run. That
#     means individual jobs can be added, renamed or gated on an event without
#     anyone having to touch repository settings.
#
#   * Every job writes machine-readable results into `ci-results/` and emits
#     GitHub annotations. Annotations come from the job's own stdout, so they
#     appear inline on the PR "Files changed" tab even for fork PRs, which get
#     a read-only token and therefore cannot comment.
#
#   * `.github/workflows/pr-report.yml` turns the uploaded `ci-results`
#     artifact into a single sticky PR comment.
#
#   * All third-party actions are pinned to a full commit SHA. The trailing
#     comment names the release that SHA belonged to at pin time; use
#     Dependabot (`.github/dependabot.yml`) to move them.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Required so the `all-checks-pass` check reports on merge queue entries.
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to attach this run's results to (optional).
        required: false
        type: string

# Least privilege by default. No job here needs to write to the repository:
# the reporting job lives in pr-report.yml, which declares its own permissions.
permissions:
  contents: read

concurrency:
  # Cancel superseded runs for pull requests only. A merge_group run must never
  # be cancelled, because the merge queue is waiting on its verdict.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  # TODO(desktop): apps/desktop does not exist yet. When the Electron app lands,
  # its jobs go here and get added to `needs:` on all-checks-pass below. Expect
  # at least: a 3-OS matrix that packages the app, a build of the
  # `skyboy-hook.exe` helper, and an integration job that feeds synthetic Claude
  # Code and Codex hook payloads through the helper. Keep `all-checks-pass` as
  # the required check name and add each new job to REQUIRED_ON in
  # .github/scripts/ci-record.mjs, or the drift guard will fail the run.

  # ---------------------------------------------------------------------------
  # Change detection
  # ---------------------------------------------------------------------------
  # A documentation-only pull request should not pay for a three-OS build
  # matrix. This job decides what kind of change this is; `typecheck` and
  # `test` are gated on its `web` output.
  #
  # The filter deliberately includes package*.json and .github/**: a dependency
  # bump or a workflow change can break the app even though no file under
  # apps/web moved. Err towards running the matrix.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists the changed files through the REST API on
      # pull_request events.
      pull-requests: read
    outputs:
      # Always 'true' or 'false', never empty. See the Decide step.
      web: ${{ steps.decide.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'package*.json'
              - '.github/**'

      # Fail safe. If detection cannot run at all (an event the action does not
      # handle, a transient API error), run the full matrix rather than let a
      # gated check be skipped without anyone having looked at the code.
      - name: Decide
        id: decide
        shell: bash
        env:
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
        run: |
          if [ "$FILTER_OUTCOME" != "success" ] || [ -z "$FILTER_WEB" ]; then
            echo "::warning title=Change detection did not run::Running the full matrix so no check is silently skipped."
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=$FILTER_WEB" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      # TODO(app-lint): `npm run lint` is `next lint`, which Next.js 16 removed,
      # and apps/web has no ESLint config at all, so it fails on a clean checkout.
      # Once ESLint is added to apps/web (eslint + eslint-config-next + a flat
      # eslint.config.mjs, and `lint` repointed at the `eslint` CLI), add a step
      # here that runs `npm --workspace apps/web run lint` through
      # `ci-record.mjs parse --tool eslint`. Until then this job lints the
      # repository's own YAML rather than pretending app lint ran.
      - name: Note that app lint is not configured yet
        shell: bash
        run: |
          echo "::notice title=App lint is not configured::The lint job covers .github YAML only."
          echo "::notice title=App lint is not configured::'npm run lint' is still 'next lint', removed in Next.js 16, and apps/web has no ESLint config."

      - name: Install the linters
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results "$RUNNER_TEMP/ci-tools"
          # actionlint is fetched and checksum-verified rather than pulled
          # through a third-party action, so the version is pinned here, in the
          # open, next to its digest. The binary goes to the runner's temp
          # directory so the checkout stays clean.
          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/ci-tools" actionlint
          "$RUNNER_TEMP/ci-tools/actionlint" --version
          python3 -m pip install --user --quiet 'yamllint==1.38.0'
          python3 -m yamllint --version

      - name: Run actionlint
        id: actionlint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: '"$RUNNER_TEMP/ci-tools/actionlint" -format ''{{json .}}'' > ci-results/actionlint.log 2>&1'

      - name: Run yamllint
        id: yamllint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python3 -m yamllint -c .github/.yamllint.yml -f parsable .github > ci-results/yamllint.log 2>&1

      - name: Record lint results
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          YAMLLINT_OUTCOME: ${{ steps.yamllint.outcome }}
        run: |
          set +e
          status=0
          if [ "$INSTALL_OUTCOME" != "success" ]; then
            node .github/scripts/ci-record.mjs summary --job lint --tool toolchain-install \
              --status fail --message "could not install the linters; see the run log" || status=1
            exit "$status"
          fi
          code=0; [ "$ACTIONLINT_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job lint --tool actionlint \
            --input ci-results/actionlint.log --exit-code "$code" || status=1
          code=0; [ "$YAMLLINT_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job lint --tool yamllint \
            --input ci-results/yamllint.log --exit-code "$code" || status=1
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-lint
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Typecheck
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    needs: changes
    # Skipped on a documentation-only change. The verdict treats a skip as a
    # pass only when `changes` reports no web-related files, so this can never
    # be skipped grey-and-forgotten.
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          # `pipefail` is set explicitly so a failing `npm ci` still fails the
          # step even though `tee` exits 0. Do not rely on the runner's default
          # shell flags for this.
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee ci-results/npm-ci.log

      # `--pretty false` gives one line per diagnostic, which is what the
      # recorder parses into file/line/column/rule records.
      - name: Typecheck
        id: check
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: npx --no-install tsc --noEmit --pretty false -p apps/web/tsconfig.json > ci-results/typecheck.log 2>&1

      - name: Record typecheck results
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          set +e
          status=0
          if [ "$INSTALL_OUTCOME" != "success" ]; then
            node .github/scripts/ci-record.mjs summary --job typecheck --tool npm \
              --status fail --message "npm ci failed; see the run log" || status=1
            exit "$status"
          fi
          code=0; [ "$CHECK_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job typecheck --tool tsc \
            --input ci-results/typecheck.log --exit-code "$code" || status=1
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-typecheck
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Test  (matrix)
  # ---------------------------------------------------------------------------
  # There is no test suite yet: apps/web's `test` script is a placeholder, so
  # the step below reports that as a notice instead of pretending to test. What
  # the matrix genuinely proves today is that the app compiles and builds on
  # all three supported platforms, which is the part that breaks per-OS. When a
  # real suite lands, it runs here without any change to this file.
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    # Same rule as typecheck: only a documentation-only change may skip it.
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # `shell: bash` on every step, on all three runners, so one script body
      # behaves identically everywhere. GitHub's Windows images ship Git Bash.
      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee ci-results/npm-ci.log

      - name: Run the test suite
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          script=$(node -e "const p=require('./apps/web/package.json');process.stdout.write((p.scripts&&p.scripts.test)||'')")
          if [ -z "$script" ] || printf '%s' "$script" | grep -q 'no tests yet'; then
            echo "::notice title=No test suite yet::apps/web has no test suite (scripts.test is '${script}')."
            echo "::notice title=No test suite yet::The matrix still verifies the build on ${RUNNER_OS}."
            exit 0
          fi
          npm --workspace apps/web test > ci-results/tests.log 2>&1

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: npm run build > ci-results/build.log 2>&1

      - name: Record test and build results
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set +e
          status=0
          if [ "$INSTALL_OUTCOME" != "success" ]; then
            node .github/scripts/ci-record.mjs summary --job "test-${RUNNER_OS}" --tool npm \
              --status fail --message "npm ci failed; see the run log" || status=1
            exit "$status"
          fi
          # Anything the suite printed goes through the generic parser, so a
          # failure still lands in the comment even before a real reporter exists.
          code=0; [ "$TESTS_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job "test-${RUNNER_OS}" --tool tests \
            --input ci-results/tests.log --exit-code "$code" || status=1
          code=0; [ "$BUILD_OUTCOME" = "success" ] || code=1
          node .github/scripts/ci-record.mjs parse --job "test-${RUNNER_OS}" --tool next-build \
            --input ci-results/build.log --exit-code "$code" || status=1
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-test-${{ matrix.os }}
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Secret scan
  # ---------------------------------------------------------------------------
  # gitleaks-action has no merge_group support, so it is skipped there. The
  # commits it would have scanned are the same ones scanned on the pull request.
  secret-scan:
    name: Secret scan
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      # No GITLEAKS_LICENSE secret is needed: gitleaks-action is free for
      # personal accounts and only requires a licence key for organisations.
      # `aijadugar/skyboy` is a user account. If this repo ever moves under an
      # organisation, add the licence as a secret and pass it here.
      #
      # GITLEAKS_ENABLE_COMMENTS is off on purpose. Its default is on, and a
      # pull request from a fork gets a read-only token, so the action's own
      # comment attempt would fail the job and block an innocent pull request.
      # Its comment would also duplicate the one pr-report.yml posts.
      #
      # GITLEAKS_ENABLE_SUMMARY is off to match how pr-report.yml treats this
      # check: pass or fail with no finding detail. A detected secret should not
      # be echoed into a job summary that is retained for the life of the run;
      # the run log and the maintainer's own investigation are the right places.
      - name: Run gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: false

      - name: Record secret scan results
        if: always()
        shell: bash
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          # Deliberately reports only pass/fail with no per-finding detail:
          # a leak's location is not something to echo back into a comment.
          if [ "$GITLEAKS_OUTCOME" = "success" ]; then
            node .github/scripts/ci-record.mjs summary --job secret-scan --tool gitleaks \
              --status pass --message "no secrets detected"
          else
            node .github/scripts/ci-record.mjs summary --job secret-scan --tool gitleaks \
              --status fail --message "gitleaks reported a possible secret or could not run; see the run log"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-secret-scan
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Dependency review
  # ---------------------------------------------------------------------------
  # Pull requests only: it diffs the dependency manifests of the base and head
  # commits, so there is nothing to review on a push or a merge group entry.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      # `comment-summary-in-pr: never` because a fork pull request only gets a
      # read-only token, and the action fails the step if it cannot comment.
      # Its verdict is reported through the ci-results artifact instead.
      - name: Review dependency changes
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never

      - name: Record dependency review results
        if: always()
        shell: bash
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          if [ "$REVIEW_OUTCOME" = "success" ]; then
            node .github/scripts/ci-record.mjs summary --job dependency-review --tool dependency-review \
              --status pass --message "no vulnerable dependency changes"
          else
            node .github/scripts/ci-record.mjs summary --job dependency-review --tool dependency-review \
              --status fail --message "a dependency change was flagged, or the review could not run; see the run log"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-dependency-review
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Pull request title
  # ---------------------------------------------------------------------------
  # Lives here rather than in its own workflow so that `all-checks-pass`
  # covers it. The title is passed through an environment variable and matched
  # as data; it is never interpolated into a script body. actionlint enforces
  # that rule for this whole file.
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      # No `continue-on-error` here on purpose: `check-title` is the last real
      # step, and a failing step is what makes this job's result `failure`.
      # With `continue-on-error` the job would report `success` and the
      # aggregator would wave a non-conventional title through.
      - name: Check the pull request title
        id: title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node .github/scripts/ci-record.mjs check-title

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-pr-title
          path: ci-results/
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Aggregator - the single required status check
  # ---------------------------------------------------------------------------
  # The job name below must not change: branch protection and the merge queue
  # key off `all-checks-pass`.
  all-checks-pass:
    name: all-checks-pass
    if: always()
    needs:
      - changes
      - lint
      - typecheck
      - test
      - secret-scan
      - dependency-review
      - pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record the pull request number
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/scripts/ci-record.mjs pr-number

      # Merges every `ci-results-*` artifact into one directory. Allowed to
      # fail: if no job got far enough to upload, the verdict below fails the
      # run, which is the correct outcome.
      - name: Collect per-job results
        id: collect
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-results-*
          path: ci-results
          merge-multiple: true

      # `changes` is deliberately not a job result: it is the change-detection
      # verdict for this diff, which ci-record.mjs uses to decide whether a
      # skipped typecheck/test is legitimate. An empty value means detection did
      # not run, and is treated strictly.
      - name: Verdict
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          JOB_RESULTS: |
            changes=${{ needs.changes.outputs.web }}
            lint=${{ needs.lint.result }}
            typecheck=${{ needs.typecheck.result }}
            test=${{ needs.test.result }}
            secret-scan=${{ needs.secret-scan.result }}
            dependency-review=${{ needs.dependency-review.result }}
            pr-title=${{ needs.pr-title.result }}
        run: node .github/scripts/ci-record.mjs verdict

      - name: Upload combined results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # This is the artifact pr-report.yml reads. Its name is part of the
          # contract between the two workflows.
          name: ci-results
          path: ci-results/
          retention-days: 5
          if-no-files-found: error
