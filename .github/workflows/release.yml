name: Release

# Cross-compile the skyboy CLI + stdio MCP server for every supported
# platform and attach the binaries to a GitHub Release. No goreleaser: the
# build is a plain GOOS/GOARCH matrix, so the workflow stays readable and
# dependency-free.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          NAME="skyboy-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then NAME="$NAME.exe"; fi
          go build -trimpath -ldflags "-s -w" -o "../dist/$NAME" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyboy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    name: Attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact dirs
        run: |
          mkdir -p release
          find dist -type f -name 'skyboy-*' -exec mv {} release/ \;
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/skyboy-*
          generate_release_notes: true
