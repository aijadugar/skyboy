# Labels pull requests by the paths they touch.
#
# `pull_request_target` is deliberate and is the only reason this works on pull
# requests from forks: it runs in the base repository's context and therefore
# gets a token that can write labels, which the `pull_request` event does not
# give a fork.
#
# That event is dangerous by default, because the workflow can reach secrets and
# a write token while the repository is checked out at the pull request's head.
# Two rules keep it safe here, and neither may be relaxed:
#
#   1. There is NO `actions/checkout` step, and there must never be one. The
#      labeler reads the changed-file list through the API, so it never needs
#      the files and never executes anything from the pull request.
#   2. Permissions are scoped to exactly what labelling needs.
#
# The only thing the pull request controls is a list of file paths, which is
# handed to the labeler as data.

name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply path labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          # Keep a stale label from lingering after the relevant files move out
          # of the diff.
          sync-labels: true
