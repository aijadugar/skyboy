[package]
name = "skyboy-hook"
description = "The tiny binary a coding agent's hook configuration calls. It converts one agent event into a Skyboy event and hands it to the running app, then exits."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "skyboy_hook"
path = "src/lib.rs"

[[bin]]
name = "skyboy-hook"
path = "src/main.rs"

[dependencies]
skyboy-protocol.workspace = true
